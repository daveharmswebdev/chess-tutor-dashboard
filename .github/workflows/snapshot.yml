# Builds today's snapshot from GitHub + Render and commits it; Render redeploys on the commit.
#
# When it builds (#33, D-1, O-1): the page refreshes in a morning and an evening slot (07:00 and
# 17:00 America/Chicago). GitHub starts top-of-hour schedules hours late or drops them, so the
# schedule ticks every 20 minutes, off the hour, and the `plan` job decides: a scheduled tick builds
# only once a slot has started today and today's snapshot hasn't been generated since that slot
# started. Any newer build counts (a chess-tutor merge, the Demo's snapshot, a manual run), because
# what matters is that the page is fresh. Manual and dispatched runs always build. If every tick is
# skipped, the page still prints when it was updated and warns past 26 hours (#3, P-2, P-7).
#
# Glossary (#21): on a chess-tutor merge or a manual run, the `mirror` job first copies chess-tutor's
# docs/glossary.json at that commit into glossary.json (and the commit into glossary.source.json).
name: Snapshot

on:
  schedule:
    - cron: "7,27,47 * * * *" # every 20 min; the plan job builds once per slot
  workflow_dispatch:
  repository_dispatch:
    types: [chess-tutor-merged] # sent by chess-tutor on each merge to main

permissions:
  contents: write

env:
  SLOT_TIMES: "07:00 17:00" # local times of the morning and evening refresh
  # One zone for both "today"s: the plan's slot day and the snapshot's file name (scripts/snapshot.ts).
  DASHBOARD_TZ: America/Chicago

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # only reads today's snapshot; the 72 daily ticks get a read-only token
    outputs:
      go: ${{ steps.plan.outputs.go }}
    steps:
      - name: Decide whether to build now
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "schedule" ]; then
            echo "Run by $EVENT: building now."; echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          now=$(date -u +%FT%TZ)
          today=$(TZ="$DASHBOARD_TZ" date +%F)
          slot=""
          for t in $SLOT_TIMES; do
            at=$(date -u -d "TZ=\"$DASHBOARD_TZ\" $today $t" +%FT%TZ)
            if [[ ! "$now" < "$at" ]]; then slot="$at"; fi
          done
          if [ -z "$slot" ]; then
            echo "Not yet: today's first refresh is at ${SLOT_TIMES%% *} $DASHBOARD_TZ."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Only a 404 (no snapshot for today yet) means "never built"; other API errors fail the tick.
          if snap=$(gh api "repos/$GITHUB_REPOSITORY/contents/snapshots/$today.json?ref=main" \
              -H "Accept: application/vnd.github.raw" 2> gh-error.txt); then
            generated=$(jq -r '.generatedAt // ""' <<< "$snap")
          elif grep -q "HTTP 404" gh-error.txt; then
            generated=""
          else
            echo "Could not read today's snapshot:" >&2; cat gh-error.txt >&2; exit 1
          fi
          # generatedAt is a JS ISO string (milliseconds), so compare instants, not strings.
          if [ -n "$generated" ] && [ "$(date -u -d "$generated" +%s)" -ge "$(date -u -d "$slot" +%s)" ]; then
            echo "Already fresh: built at $generated, after the slot that started at $slot."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Building: the slot started at $slot, last build ${generated:-none today}."
          echo "go=true" >> "$GITHUB_OUTPUT"

  # On a chess-tutor merge (or a manual run), copy chess-tutor's docs/glossary.json at that commit (#21,
  # O-1, P-1). If the fetch fails this job goes red with the reason and the snapshot still builds from
  # the copy already here, so the glossary is never emptied (P-2).
  mirror:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    # Its own group: in the shared "snapshot" group a newer pending job could cancel this one.
    concurrency:
      group: glossary-mirror
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Mirror the glossary
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_SHA: ${{ github.event.client_payload.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$DISPATCH_SHA"
          # A manual run mirrors chess-tutor's current main (public, read with the run's own token).
          if [ "$EVENT" = "workflow_dispatch" ]; then sha=$(gh api repos/daveharmswebdev/chess-tutor/commits/main --jq .sha); fi
          bash .github/scripts/mirror-glossary.sh "$sha"
          git add glossary.json glossary.source.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "glossary: mirror chess-tutor@${sha:0:7} docs/glossary.json (#21)"
          # main may have moved (a snapshot commit); those never touch the glossary, so rebase and retry.
          for attempt in 1 2 3; do
            if git push -q origin HEAD:main; then echo "Pushed"; exit 0; fi
            git pull -q --rebase origin main
          done
          echo "::error::Could not push the glossary mirror after 3 attempts." >&2; exit 1

  snapshot:
    needs: [plan, mirror]
    # always(): a skipped mirror (scheduled ticks) or a failed one must not stop the build (P-2).
    if: always() && needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # On the job, not the workflow, so ticks that skip never queue behind (or cancel) a real build.
    concurrency:
      group: snapshot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # includes the mirror job's glossary commit, which is newer than the event's sha
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Build snapshot
        run: pnpm snapshot
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_GH_TOKEN }} # reads chess-tutor + Project 5
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          APP_URL: ${{ vars.APP_URL }}
          DEMO_TIME: ${{ vars.DEMO_TIME }} # demoPlannedAt (#29); empty means the default
          DEMO_TZ: ${{ vars.DEMO_TZ }}
      - name: Commit snapshot
        # If main moved (a merge, or the Demo workflow's snapshot), rebuild on the latest main and retry.
        run: bash .github/scripts/commit-snapshot.sh
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_GH_TOKEN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          APP_URL: ${{ vars.APP_URL }}
          DEMO_TIME: ${{ vars.DEMO_TIME }} # demoPlannedAt (#29); empty means the default
          DEMO_TZ: ${{ vars.DEMO_TZ }}
